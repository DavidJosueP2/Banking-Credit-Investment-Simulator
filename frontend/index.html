<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/bank/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brunexa Bank</title>
    <script>
      (() => {
        let storedTheme = null
        try {
          storedTheme = localStorage.getItem('brunexa-theme')
        } catch {
          // The preferred theme still works when storage is unavailable.
        }
        const isDark = storedTheme === 'dark' || (
          storedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches
        )
        document.documentElement.classList.toggle('dark', isDark)
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
