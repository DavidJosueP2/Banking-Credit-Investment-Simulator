spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:financiero_db}?currentSchema=${DB_SCHEMA:financiero}
    username: ${DB_USER:financiero}
    password: ${DB_PASSWORD:financiero_dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:financiero}
    create-schemas: true
    placeholders:
      app-schema: ${DB_SCHEMA:financiero}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:financiero}
        format_sql: true
        jdbc:
          time_zone: ${APP_TIME_ZONE:America/Guayaquil}
  jackson:
    time-zone: ${APP_TIME_ZONE:America/Guayaquil}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}

app:
  biometrics:
    # Umbral de prueba de vida: 50-60 detecta fotos y pantallas; 80-90, deepfakes y video inyectado.
    min-liveness: ${BIOMETRICS_MIN_LIVENESS:75}
    approve-similarity: ${BIOMETRICS_APPROVE_SIMILARITY:99}
    review-similarity: ${BIOMETRICS_REVIEW_SIMILARITY:90}
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
